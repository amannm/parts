geometry:
  builder: block_with_hole
  params:
    length: 1.0
    width: 1.0
    height: 1.0
    hole_radius: 0.2
  units: m
  dimension: 3
  coordinate_system: cartesian
tagging:
  facets:
  - type: PlaneAtMin
    name: left
    axis: x
  - type: PlaneAtMax
    name: right
    axis: x
  cells:
  - type: AllVolumes
    name: solid
mesh:
  global_size: 0.1
workflow:
  mode: single
  nodes:
  - id: main
    physics:
      model: elasticity
      parameters:
        E: 200000000000.0
        nu: 0.3
        body_force:
        - 0.0
        - 0.0
        - 0.0
        derived:
        - von_mises
    bcs:
    - type: dirichlet
      tag: left
      value:
      - 0.0
      - 0.0
      - 0.0
    - type: neumann
      tag: right
      value:
      - 1000000.0
      - 0.0
      - 0.0
  couplings: []
  solver: {}
materials:
  by_tag:
    solid:
      E: 200000000000.0
      nu: 0.3
solver: {}
outputs:
  directory: out
  format: vtx
metadata: {}
