geometry:
  builder: ipmsm
  params:
    global_:
      poles: 8
      slots: 48
      angle_offset_deg: 0.0
      units: mm
    build:
      include_magnets: true
      export_enabled: false
      png_enabled: false
      show_interactive: false
  units: mm
  dimension: 3
  coordinate_system: cartesian
tagging:
  facets:
  - type: PlaneAtMin
    name: x_min
    axis: x
  - type: PlaneAtMax
    name: x_max
    axis: x
  cells:
  - type: AllVolumes
    name: domain
mesh:
  global_size: 4.0
workflow:
  mode: single
  nodes:
  - id: main
    physics:
      model: magnetostatic
      parameters:
        include_B: true
        include_H: true
        derived:
        - B_mag
        - energy_density
    bcs:
    - type: dirichlet
      tag: x_min
      value:
      - 0.0
      - 0.0
      - 0.0
    - type: dirichlet
      tag: x_max
      value:
      - 0.0
      - 0.0
      - 0.0
  couplings: []
  solver: {}
materials:
  by_tag:
    domain:
      mu_r: 1.0
      current_density:
      - 0.0
      - 0.0
      - 0.0
      magnetization:
      - 0.0
      - 0.0
      - 100000.0
solver: {}
outputs:
  directory: out
  format: vtx
metadata: {}
exploration:
  mode: cartesian
  name: ipmsm_angle
  output_directory: out/sweeps
  samples: null
  seed: 42
  parameters:
  - name: rotor_angle_deg
    path: geometry.params.global_.angle_offset_deg
    labels:
    - 0deg
    - 15deg
    - 30deg
    - 45deg
    values:
    - 0
    - 15
    - 30
    - 45
  objective: null
  constraints: []
  parallel:
    workers: 1
