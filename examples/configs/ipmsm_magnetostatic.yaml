geometry:
  builder: ipmsm
  params:
    global_:
      poles: 8
      slots: 48
      angle_offset_deg: 0.0
      units: mm
    build:
      include_magnets: true
      export_enabled: false
      png_enabled: false
      show_interactive: false
  units: mm

tags:
  facets:
    - name: x_min
      rule: PlaneAtMin
      params:
        axis: x
    - name: x_max
      rule: PlaneAtMax
      params:
        axis: x
  cells:
    - name: domain
      rule: AllVolumes

meshing:
  global_size: 4.0

physics:
  model: magnetostatic
  parameters:
    include_B: true
    include_H: true
    derived: ["B_mag", "energy_density"]

bcs:
  items:
    - type: dirichlet
      tag: x_min
      value: [0.0, 0.0, 0.0]
    - type: dirichlet
      tag: x_max
      value: [0.0, 0.0, 0.0]

materials:
  by_tag:
    domain:
      mu_r: 1.0
      current_density: [0.0, 0.0, 0.0]
      magnetization: [0.0, 0.0, 1.0e5]

outputs:
  directory: out
  format: vtx
