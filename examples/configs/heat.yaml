geometry:
  builder: block_with_hole
  params:
    length: 1.0
    width: 1.0
    height: 1.0
    hole_radius: 0.2
  units: m
  dimension: 3
  coordinate_system: cartesian
tagging:
  facets:
  - type: PlaneAtMin
    name: left
    axis: x
  - type: PlaneAtMax
    name: right
    axis: x
  cells:
  - type: AllVolumes
    name: solid
mesh:
  global_size: 0.1
workflow:
  mode: single
  nodes:
  - id: main
    physics:
      model: heat
      parameters:
        source: 1.0
        kappa: 5.0
    bcs:
    - type: dirichlet
      tag: left
      value: 300.0
    - type: robin
      tag: right
      value: 290.0
      alpha: 10.0
  couplings: []
  solver: {}
materials:
  by_tag:
    solid:
      kappa: 5.0
solver: {}
outputs:
  directory: out
  format: vtx
metadata: {}
