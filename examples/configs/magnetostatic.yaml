geometry:
  builder: block_with_hole
  params:
    length: 0.1
    width: 0.1
    height: 0.1
    hole_radius: 0.0
  units: m
  dimension: 3
  coordinate_system: cartesian

tags:
  facets:
    - type: PlaneAtMin
      name: x_min
      axis: x
    - type: PlaneAtMax
      name: x_max
      axis: x
  cells:
    - type: AllVolumes
      name: domain

meshing:
  global_size: 0.02

physics:
  model: magnetostatic
  parameters:
    include_B: true
    include_H: true

bcs:
  items:
    - type: dirichlet
      tag: x_min
      value: [0.0, 0.0, 0.0]
    - type: dirichlet
      tag: x_max
      value: [0.0, 0.0, 0.0]

materials:
  by_tag:
    domain:
      mu_r: 1000.0
      current_density: [0.0, 0.0, 1000000.0]

workflow:
  type: single

units:
  internal_system: SI

outputs:
  directory: out
  format: vtx
