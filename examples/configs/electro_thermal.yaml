geometry:
  builder: block_with_hole
  params:
    length: 0.1
    width: 0.1
    height: 0.2
    hole_radius: 0.005
  units: m
  dimension: 3
  coordinate_system: cartesian
tagging:
  facets:
  - type: PlaneAtMin
    name: z_min
    axis: z
  - type: PlaneAtMax
    name: z_max
    axis: z
  cells:
  - type: AllVolumes
    name: domain
mesh:
  global_size: 0.01
workflow:
  mode: coupled
  nodes:
  - id: electric
    physics:
      model: electric_ac
      parameters:
        include_joule_heat: true
    bcs:
    - type: dirichlet
      tag: z_min
      value: 0.0
    - type: dirichlet
      tag: z_max
      value: 1.0
  - id: thermal
    physics:
      model: heat_transient
      parameters:
        time:
          dt: 0.1
          t_end: 10.0
          initial: 293.15
        targets:
        - name: warmup
          tag: domain
          temperature: 333.15
          mode: avg
          direction: above
    bcs:
    - type: robin
      tag: z_max
      value: 293.15
      alpha: 10.0
  couplings:
  - from_node: electric
    field: joule_heat
    to_node: thermal
    target: source_field
    operator: field
    reduction: avg
  - from_node: thermal
    field: T
    to_node: electric
    target: runtime_material_variables.T
    operator: scalar-reduction
    reduction: avg
  solver: {}
materials:
  by_tag:
    domain:
      sigma:
        model: polynomial
        variable: T
        reference: 293.15
        coefficients:
        - 58000000.0
        - -10000.0
      kappa: 0.6
      rho: 1000.0
      cp: 4182.0
solver: {}
outputs:
  directory: out
  format: vtx
metadata: {}
