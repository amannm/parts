geometry:
  builder: qfn
  params:
    body_x: 5.0
    body_y: 5.0
    body_height: 0.85
    leads_per_side: 10
  units: mm
  dimension: 3
  coordinate_system: cartesian

tags:
  facets:
    - type: PlaneAtMin
      name: left
      axis: x
    - type: PlaneAtMax
      name: right
      axis: x
  cells:
    - type: AllVolumes
      name: domain

meshing:
  global_size: 0.25

physics:
  model: poisson
  parameters:
    source: 0.0
    kappa: 1.0

bcs:
  items:
    - type: dirichlet
      tag: left
      value: 0.0
    - type: dirichlet
      tag: right
      value: 1.0

materials:
  by_tag:
    domain:
      kappa: 1.0

workflow:
  type: single

units:
  internal_system: SI

outputs:
  directory: out
  format: vtx
