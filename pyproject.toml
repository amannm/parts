[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simstack"
version = "1.0.0"
description = "Parametric CAD to multiphysics FEM pipeline"
readme = "SPEC.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SimStack Contributors" }
]
dependencies = [
  "cadquery",
  "optuna>=4.0",
  "pint>=0.24",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scipy>=1.13",
]

[project.scripts]
simstack = "simstack.cli:main"

[project.entry-points."simstack.cad_builders"]

[project.entry-points."simstack.physics"]

[project.entry-points."simstack.tag_rules"]

[project.entry-points."simstack.postprocessors"]

[project.entry-points."simstack.parts"]

[tool.hatch.build.targets.wheel]
packages = ["src/simstack", "src/simparts"]

[tool.uv]
dev-dependencies = [
  "pytest>=7.4",
  "ruff>=0.4",
  "mypy>=1.8",
]
